name: release
on:
  push:
    branches: [main]
    paths: ['release/**', 'VERSION']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" release/MegaDonk-MIDI-Dumper-Windows.zip --clobber
            exit 0
          fi
          gh release create "v$v" release/MegaDonk-MIDI-Dumper-Windows.zip --target "$GITHUB_SHA" \
            --title "MegaDonk MIDI Dumper $v" \
            --notes "Windows download: MegaDonk-MIDI-Dumper-Windows.zip. Unzip it anywhere, then drop .tbt files or folders on MegaDonk MIDI Dumper.exe. See the README for details."
