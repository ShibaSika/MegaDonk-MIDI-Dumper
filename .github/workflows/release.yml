name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/MegaDonk-MIDI-Dumper-Windows.zip \
            --title "MegaDonk MIDI Dumper ${GITHUB_REF_NAME#v}" \
            --notes "Windows download: MegaDonk-MIDI-Dumper-Windows.zip. Unzip it anywhere, then drop .tbt files or folders on MegaDonk MIDI Dumper.exe. See the README for details."
